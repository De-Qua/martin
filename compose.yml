services:
  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: dq_tiles_martin
    restart: unless-stopped
    volumes:
      - "./tileserver:/data"
    # command: "/data/mbtiles --webui enable-for-all"
    command: "--config /data/config.martin.yaml"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

networks:
  default:
    name: dequa_nw
    external: true